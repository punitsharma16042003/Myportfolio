<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="teflon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="heatGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#090d16" />

  <!-- Lab Bench -->
  <polygon points="0,480 800,480 800,600 0,600" fill="#111827" />
  <line x1="0" y1="480" x2="800" y2="480" stroke="#334155" stroke-width="2" />

  <!-- Laboratory Box Furnace / Heating Oven (Left) -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="280" height="320" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3" />
    <rect x="25" y="30" width="230" height="190" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <rect x="25" y="30" width="230" height="190" rx="6" fill="url(#heatGlow)" />
    
    <!-- Digital Controller Panel -->
    <rect x="25" y="240" width="230" height="60" rx="4" fill="#020617" />
    <text x="40" y="265" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ef4444" font-weight="700">TEMP: 180.0 °C</text>
    <text x="40" y="285" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">TIME: 08:00:00 h &bull; AUTO</text>
    <circle cx="230" cy="270" r="6" fill="#ef4444" />
  </g>

  <!-- Autoclave Reactor (Exploded Anatomy on Right) -->
  <g transform="translate(460, 130)">
    <!-- Stainless Steel Outer Shell -->
    <rect x="40" y="90" width="160" height="260" rx="12" fill="url(#steel)" stroke="#1e293b" stroke-width="2" />
    <!-- Steel Cap Bolts -->
    <rect x="25" y="60" width="190" height="36" rx="4" fill="url(#steel)" stroke="#1e293b" stroke-width="2" />
    <circle cx="45" cy="78" r="8" fill="#1e293b" />
    <circle cx="85" cy="78" r="8" fill="#1e293b" />
    <circle cx="120" cy="78" r="8" fill="#1e293b" />
    <circle cx="155" cy="78" r="8" fill="#1e293b" />
    <circle cx="195" cy="78" r="8" fill="#1e293b" />

    <!-- Teflon PTFE Liner (Cutaway) -->
    <rect x="65" y="125" width="110" height="200" rx="6" fill="url(#teflon)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Precursor Solution inside Teflon -->
    <rect x="75" y="210" width="90" height="105" rx="3" fill="#059669" fill-opacity="0.85" />
    <ellipse cx="120" cy="210" rx="45" ry="10" fill="#34d399" />
    
    <!-- Annotations -->
    <text x="120" y="375" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="600">304 Stainless Steel Jacket</text>
    <text x="120" y="395" font-family="sans-serif" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">PTFE Liner: CQD Precursor (100 mL)</text>
  </g>

  <!-- Metadata Card -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="230" height="66" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981" font-weight="700">⚗️ SYNTHESIS MEMORY #04</text>
    <text x="14" y="42" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Hydrothermal Autoclave Setup</text>
    <text x="14" y="58" font-family="sans-serif" font-size="10" fill="#94a3b8">180°C Synthesis &bull; Green Nanochemistry</text>
  </g>
</svg>