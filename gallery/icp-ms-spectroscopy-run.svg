<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="instBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="50%" stop-color="#111c2e" />
      <stop offset="100%" stop-color="#080e18" />
    </linearGradient>
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#instBg)" />

  <!-- Instrument Chassis (ICP-MS Spectrometer) -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="380" height="360" rx="12" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <rect x="20" y="20" width="340" height="180" rx="8" fill="#090e17" stroke="#1e293b" stroke-width="2" />
    
    <!-- Torch Chamber Observation Window -->
    <circle cx="190" cy="110" r="70" fill="#030712" stroke="#475569" stroke-width="4" />
    <ellipse cx="190" cy="110" rx="60" ry="60" fill="url(#plasmaGlow)" />
    <!-- Argon Plasma Torch Flame -->
    <polygon points="150,110 200,98 230,110 200,122" fill="#ffffff" />
    <polygon points="140,110 210,90 245,110 210,130" fill="#93c5fd" opacity="0.6" />

    <!-- Status Indicators -->
    <rect x="30" y="220" width="320" height="110" rx="6" fill="#0f172a" />
    <text x="50" y="248" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">RF POWER: 1550 W (STABLE)</text>
    <text x="50" y="272" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">NEBULIZER GAS: 0.98 L/min</text>
    <text x="50" y="296" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b">VACUUM: 1.4 x 10^-5 Pa</text>
    <circle cx="315" cy="272" r="8" fill="#10b981" />
  </g>

  <!-- Analytical Computer Screen & Calibration Spectrum -->
  <g transform="translate(470, 160)">
    <!-- Monitor Stand -->
    <polygon points="120,380 150,340 170,340 200,380" fill="#334155" />
    <rect x="80" y="380" width="160" height="16" rx="3" fill="#1e293b" />
    
    <!-- Monitor Frame -->
    <rect x="0" y="0" width="280" height="340" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3" />
    <rect x="12" y="12" width="256" height="316" rx="6" fill="#022c22" stroke="#059669" stroke-width="1.5" />

    <!-- Screen Title -->
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="700">TRACE HEAVY METALS</text>
    <text x="24" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">Calibration: R² = 0.9998</text>

    <!-- Calibration Graph Lines -->
    <line x1="30" y1="260" x2="245" y2="260" stroke="#059669" stroke-width="1.5" />
    <line x1="30" y1="70" x2="30" y2="260" stroke="#059669" stroke-width="1.5" />

    <!-- Calibration Points and Line -->
    <line x1="30" y1="240" x2="230" y2="90" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="60" cy="220" r="4" fill="#facc15" />
    <circle cx="100" cy="188" r="4" fill="#facc15" />
    <circle cx="150" cy="150" r="4" fill="#facc15" />
    <circle cx="200" cy="112" r="4" fill="#facc15" />

    <!-- Peaks Display -->
    <path d="M 35,258 Q 50,258 55,200 Q 60,258 75,258 Q 90,258 100,160 Q 110,258 130,258 Q 145,258 150,110 Q 155,258 175,258 Q 190,258 195,140 Q 200,258 240,258" fill="none" stroke="#10b981" stroke-width="1.5" />

    <text x="142" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399" text-anchor="middle">208Pb</text>
    <text x="96" y="150" font-family="'JetBrains Mono', monospace" font-size="9" fill="#facc15" text-anchor="middle">111Cd</text>
    <text x="195" y="130" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">75As</text>

    <!-- LOD Metric -->
    <rect x="24" y="276" width="232" height="38" rx="4" fill="#064e3b" />
    <text x="34" y="292" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">LOD: Pb &lt; 0.02 ppb</text>
    <text x="34" y="306" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6ee7b7">Cd &lt; 0.01 ppb &bull; As &lt; 0.05 ppb</text>
  </g>

  <!-- Instrumentation Info Watermark -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="240" height="68" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#facc15" font-weight="700">⚡ INSTRUMENT RUN #03</text>
    <text x="14" y="42" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Central Facility &bull; IIT Ropar</text>
    <text x="14" y="58" font-family="sans-serif" font-size="10" fill="#94a3b8">Inductively Coupled Plasma Mass Spectrometry</text>
  </g>
</svg>